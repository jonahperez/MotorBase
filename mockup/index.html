<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotorBase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Login ===== -->
  <div id="view-login" class="login">
    <div class="login-card">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#ea580c"/><path d="M12 6v6l4 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg>
        <div class="brand-name">Motor<span>Base</span></div>
      </div>
      <p>Build and supply your engine, in one place.</p>
      <button class="google-btn" id="google-signin">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.1 0 24 0 14.6 0 6.4 5.4 2.6 13.2l7.8 6.1C12.2 13.7 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.2-9.5 6.2-17z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6.1C1 15.8 0 19.8 0 23.5s1 7.7 2.6 10.9l7.8-6.1z"/><path fill="#34A853" d="M24 47c6.1 0 11.3-2 15-5.5l-7.1-5.5c-2 1.4-4.6 2.2-7.9 2.2-6.4 0-11.8-4.2-13.6-9.9l-7.8 6.1C6.4 42.6 14.6 47 24 47z"/></svg>
        Continue with Google
      </button>
      <div class="login-tenant">
        Signing in as <b>Precision Engine Works</b> · tenant claim <code>custom:tenant_id</code> attached via Cognito
      </div>
      <div class="login-note">Amazon Cognito · Google federated identity</div>
    </div>
  </div>

  <!-- ===== App shell ===== -->
  <div id="view-app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#ea580c"/><path d="M12 6v6l4 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg>
        <div class="brand-name">Motor<span>Base</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="nav-label">Tenant</div>
        <div class="tenant-switch">
          <span class="dot"></span>
          <div><b style="color:#fff">Precision Engine Works</b><small>tenant · pooled</small></div>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div id="crumb" class="crumb"></div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input placeholder="Search builds, parts, specs…" />
        </div>
        <div class="avatar">RG</div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
